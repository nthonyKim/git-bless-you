<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>git bless you</title>
  <meta name="description" content="당신에게 git의 축복이 있기를" />
  <style>
    :root { --bg:#0c1117; --fg:#e6edf3; --muted:#9da9b5; --card:#0f1620; --border:#2b3a50; --acc:#7ee787; --los:#ff7b72; --shadow:0 6px 18px rgba(0,0,0,.25); }
    *{box-sizing:border-box}
    html,body{min-height:100vh;background:var(--bg)}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Apple SD Gothic Neo,"맑은 고딕",sans-serif;color:var(--fg);background:var(--bg)}
    .wrap{max-width:920px;margin:0 auto;padding:16px}
    h1{margin:0;font-size:clamp(20px,5vw,28px)}
    .sub{color:var(--muted);margin-top:6px;font-size:14px}

    /* Panels & controls – mobile-first */
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
    .controls{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
    .controls .group{display:flex;gap:8px;flex:1;min-width:220px}
    label{color:var(--muted);font-size:12px}
    input[type=number], input[type=text]{flex:1;min-width:0;border:1px solid var(--border);background:#0b121a;color:var(--fg);border-radius:12px;padding:12px 10px;font-size:16px}
    button{flex:0 0 auto;cursor:pointer;border:1px solid var(--border);background:#0b1420;color:var(--fg);border-radius:12px;padding:10px 12px;font-size:15px}
    button:active{transform:translateY(1px)}
    button:disabled{opacity:.6}
    .mode{display:flex;gap:8px;align-items:center}
    .mode label{display:flex;gap:6px;align-items:center;border:1px solid var(--border);padding:8px 10px;border-radius:10px;background:#0b1420;font-size:14px;cursor:pointer}
    .autoRoll{border:none!important;background:transparent!important;padding:0!important;font-size:14px;cursor:pointer;color:var(--muted)}
    .mode input{accent-color:#7ee787}

    /* Cards (normal/compact) */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px}
    .grid.compact{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}
    .grid.compact .card{padding:8px;min-height:80px}
    .grid.compact .result{font-size:24px}

    /* Dense list-like modes (auto-chosen) */
    .grid.list2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .grid.list3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    /* Inside card becomes column stack on list3; list2 stays row-like */
    .grid.list2 .card, .grid.list3 .card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:8px 10px;min-height:auto}
    .grid.list2 .card .top, .grid.list3 .card .top{display:flex;align-items:center;min-width:0;gap:6px}
    /* 목록형에서 배지 제거 (이름 가리지 않도록) */
    .grid.list2 .badge, .grid.list3 .badge{display:none !important; width:0; height:0; margin:0; padding:0;}
    /* 이름: 목록형은 2줄까지 허용 */
    .grid.list2 .top > div, .grid.list3 .top > div{
      flex:1;min-width:0;white-space:normal;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2;
    }
    /* 결과: 목록형에서 오른쪽 정렬, 가로폭은 이름 우선 */
    .grid.list2 .result, .grid.list3 .result{font-size:20px;text-align:right;align-self:flex-end;width:100%;}
    .grid.list2 .card button, .grid.list3 .card button{display:none}

    .card{background:#0b121a;border:1px solid var(--border);border-radius:14px;padding:12px;min-height:100px;display:flex;flex-direction:column;gap:8px;min-width:0}
    .card:focus-visible{outline:1px dashed var(--acc); outline-offset:3px}
    .card .top{display:flex;align-items:center;justify-content:space-between;min-width:0}
    .card .top > div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .badge{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:3px 8px}
    .result{font-variant-numeric:tabular-nums;font-size:34px;font-weight:800;letter-spacing:.5px}
    .win{outline:2px solid var(--acc);border-radius:16px;box-shadow:0 0 0 4px rgba(126,231,135,.12);animation:resultGlow .7s ease-out}
    .lose{outline:2px solid var(--los);border-radius:16px;box-shadow:0 0 0 4px rgba(255,123,114,.10);animation:resultGlowLose .7s ease-out}
    @keyframes resultGlow{0%{box-shadow:0 0 0 0 rgba(126,231,135,.4)}60%{box-shadow:0 0 14px 6px rgba(126,231,135,.55)}100%{box-shadow:0 0 0 0 rgba(126,231,135,.4)}}
    @keyframes resultGlowLose{0%{box-shadow:0 0 0 0 rgba(255,123,114,.4)}60%{box-shadow:0 0 14px 6px rgba(255,123,114,.55)}100%{box-shadow:0 0 0 0 rgba(255,123,114,.4)}}

    /* Reveal animation */
    @keyframes pulsePop{0%{transform:scale(.96)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
    .card.reveal{animation:pulsePop .28s ease-out}
    .card.reveal .result{filter:drop-shadow(0 2px 6px rgba(126,231,135,.18))}

    /* Summary */
    .summary{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;border-top:1px dashed var(--border);padding-top:8px}
    .pill{border:1px solid var(--border);padding:8px 10px;border-radius:10px;background:#0b1420;font-size:14px}
    .hidden{display:none!important}

    /* Responsive: single column on small screens */
    @media (max-width: 480px){
      .grid{grid-template-columns:1fr}
      .controls{flex-direction:column}
      button, input[type=number], input[type=text]{width:100%}
    }

    /* Toast */
    .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-20px);background:#0b1420;border:1px solid var(--border);color:var(--fg);padding:10px 14px;border-radius:12px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:transform .25s ease, opacity .25s ease;z-index:9999;white-space:nowrap;font-size:14px}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .summary button#copyResult{margin-left:auto}

    /* Reduced motion preference */
    @media (prefers-reduced-motion: reduce){
      *{scroll-behavior:auto!important}
      .card.reveal{animation:none}
      .win,.lose{box-shadow:none;animation:none}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>git bless you</h1>
    <div class="sub"><b>README</b> <i>당신에게 git의 축복이 있기를</i> </div>

    <section class="panel" style="margin-top:12px">
      <div class="controls">
        <div class="mode" role="radiogroup" aria-label="입력 방식" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;white-space:nowrap;">
          <label><input type="radio" name="mode" value="count" checked> 인원</label>
          <label><input type="radio" name="mode" value="names"> 이름</label>
          <label class="autoRoll" style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="autoRoll"> 자동 ROLL</label>
        </div>
        
        <div class="group" id="group-count" style="flex:1">
          <div style="flex:1">
            <input id="count" type="number" inputmode="numeric" pattern="[0-9]*" min="2" max="100" value="6" />
          </div>
        </div>
        <div class="group hidden" id="group-names" style="flex:1">
          <div style="flex:1">
            <input id="names" type="text" placeholder="이름들 (쉼표로 구분)" />
          </div>
        </div>
        <button id="generate">라운드 시작</button>
      </div>
    </section>

    <section id="cards" class="grid" aria-live="polite" aria-busy="false"></section>

    <section id="sum" class="panel hidden" style="margin-top:10px">
      <div class="summary">
        <span class="pill" id="done">0 / 0 완료</span>
        <span class="pill" id="hi">최고: -</span>
        <span class="pill" id="lo">최저: -</span>
        <span class="pill hidden" id="ties"></span>
        <button id="copyResult" disabled>결과 복사하기</button>
      </div>
    </section>

    <div id="toast" class="toast" aria-live="polite"></div>
  </div>

  <script>
    // ---------- Helpers ----------
    const $ = (s, r=document)=>r.querySelector(s);
    const $$ = (s, r=document)=>Array.from(r.querySelectorAll(s));

    // Fisher–Yates shuffle (in-place)
    function shuffleArray(arr){
      for(let i=arr.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]] = [arr[j],arr[i]];
      }
      return arr;
    }

    const cards = $('#cards');
    const sum = $('#sum');
    const pDone = $('#done');
    const pHi = $('#hi');
    const pLo = $('#lo');
    const pTies = $('#ties');
    const toastEl = $('#toast');
    const copyBtn = $('#copyResult');

    function showToast(lines, holdMs=1600){
      if(!toastEl) return;
      const msg = Array.isArray(lines) ? lines.join('   ') : String(lines||'');
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(showToast._tmr);
      showToast._tmr = setTimeout(()=>{ toastEl.classList.remove('show'); }, holdMs);
    }

    // Simple, robust clipboard helper
    async function copyText(text){
      try{
        if(navigator.clipboard && window.isSecureContext){
          await navigator.clipboard.writeText(String(text ?? ''));
          return true;
        }
      }catch(_){/* fallthrough */}
      try{
        const ta = document.createElement('textarea');
        ta.value = String(text ?? '');
        ta.setAttribute('readonly','');
        ta.style.position='fixed';
        ta.style.opacity='0';
        ta.style.pointerEvents='none';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      }catch(_){
        return false;
      }
    }

    // ---------- State ----------
    let state = { players: [], lastN: 0, announced: false, autoRolling: false };
    const REVEAL_DELAY_MS = 400;

    // Shared util
    const nameOf = (x)=> (x.name && x.name.length? x.name : `P${x.id}`);

    function buildSummaryText(){
      const total = state.players.length;
      const rolled = state.players.filter(p=>p.rolled);
      const max = rolled.length? Math.max(...rolled.map(p=>p.value)) : null;
      const min = rolled.length? Math.min(...rolled.map(p=>p.value)) : null;
      const highs = rolled.filter(p=>p.value===max).map(nameOf);
      const lows  = rolled.filter(p=>p.value===min).map(nameOf);
      const header = `🎲 결과`;
      const hiLine = (max!=null? `👍: ${highs.join(', ')} (${max})` : `👍: -`);
      const loLine = (min!=null? `👎: ${lows.join(', ')} (${min})` : `👎: -`);
      const tail = `총 ${total}명 참여${(highs.length>1 || lows.length>1)? ' / 동점 있음':''}`;
      const list = state.players.map(p=>`• ${nameOf(p)} — ${p.rolled? p.value : '—'}`).join('\n');
      return [header, hiLine, loLine, tail, '', list].join('\n');
    }

    // ---------- View helpers ----------
    function isListMode(){ return cards.classList.contains('list2') || cards.classList.contains('list3'); }

    function getNextTarget(){
      if(isListMode()){
        const unrolledCard = $$('.card').find(c=>{
          const id = parseInt(c.dataset.id,10); const p = state.players[id-1];
          return p && !p.rolled;
        });
        return unrolledCard ? unrolledCard.querySelector('button:not(:disabled)') : null;
      }
      return $$('.card button:not(:disabled)')[0] || null;
    }

    function focusCard(card, opts={scroll:true}){
      if(!card) return;
      try{ card.classList.add('reveal'); }catch(_){ }
      // Keep focus for keyboard users without forcing scroll
      try{ card.focus({preventScroll:true}); }catch(_){ }
      if(opts.scroll){
        try{ card.scrollIntoView({behavior:'auto', block:'center', inline:'nearest'}); }catch(_){ }
      }
      setTimeout(()=>card.classList.remove('reveal'), 200);
    }

    // ---------- Auto roll (sequential) ----------
    const wait = (ms)=> new Promise(r=>setTimeout(r, ms));
    async function autoRollButtons(buttons){
      if(state.autoRolling) return;
      state.autoRolling = true;
      for(const btn of buttons){
        if(!btn || btn.disabled) continue;
        const card = btn.closest('.card');
        // avoid scroll jank during auto-roll
        focusCard(card, {scroll:true});
        btn.click();
        await wait(REVEAL_DELAY_MS);
      }
      try{ document.activeElement?.blur?.(); }catch(_){}
      state.autoRolling = false;
    }

    // ---------- RNG ----------
    function rng(){
      const u32 = new Uint32Array(1); crypto.getRandomValues(u32);
      const v = Math.floor((u32[0] / 2**32) * 1000) + 1; // 1..1000
      return Math.min(1000, Math.max(1, v));
    }

    // ---------- Core ----------
    function reset(n){
      state.players = [];
      state.lastN = n || state.lastN || 6;
      state.announced = false;
      cards.className = 'grid';
      cards.innerHTML = '';
      sum.classList.add('hidden');
      toastEl?.classList.remove('show');
      if(toastEl) toastEl.textContent='';
    }

    function renderPlayersAndInit(players){
      const frag = document.createDocumentFragment();
      players.forEach(p=> frag.appendChild(renderCard(p)));
      cards.appendChild(frag);
      sum.classList.remove('hidden');
      updateSummary();
      autoLayoutToFit();
      if($('#autoRoll')?.checked){
        const order = shuffleArray($$('.card button'));
        autoRollButtons(order);
      }
    }

    function start(n){
      reset(n);
      const arr = [];
      for(let i=0;i<state.lastN;i++){
        const p = {id:i+1,name:`P${i+1}`,value:null,rolled:false};
        state.players.push(p);
        arr.push(p);
      }
      renderPlayersAndInit(arr);
    }

    function startByNames(names){
      const clean = names.split(',').map(s=>s.trim()).filter(Boolean);
      if(clean.length < 2){ alert('이름을 쉼표로 2명 이상 입력해주세요'); return; }
      if(clean.length > 100){ alert('최대 100명까지 입력 가능합니다'); return; }
      reset(clean.length);
      const arr = clean.map((nm,i)=>({id:i+1,name:nm,value:null,rolled:false}));
      state.players = arr;
      renderPlayersAndInit(arr);
    }

    function renderCard(p){
      const card = document.createElement('article');
      card.className = 'card';
      card.tabIndex = 0; // focusable so Space works in list mode
      card.dataset.id = p.id;

      const top = document.createElement('div');
      top.className='top';
      const title = document.createElement('div');
      title.textContent = p.name || `Player ${p.id}`;
      const badge = document.createElement('span');
      badge.className='badge';
      badge.textContent = `#${p.id}`;
      top.append(title,badge);

      const result = document.createElement('div');
      result.className='result';
      result.textContent='—';

      const btn = document.createElement('button');
      btn.textContent='ROLL';
      btn.style.width='100%';
      btn.style.maxWidth='100%';
      btn.setAttribute('aria-label', `${nameOf(p)} ROLL`);

      const rollOnce = ()=>{
        if(p.rolled) return;
        focusCard(card);
        p.value = rng();
        p.rolled = true;
        result.textContent = p.value;
        btn.disabled = true;
        card.classList.remove('win','lose');
        updateSummary();};
      btn.addEventListener('click', rollOnce);
      card.addEventListener('click', (e)=>{ if(e.target!==btn) rollOnce(); });

      card.append(top,result,btn);
      return card;
    }

    function updateSummary(){
      const total = state.players.length;
      const rolled = state.players.filter(x=>x.rolled);
      pDone.textContent = `${rolled.length} / ${total} 완료`;
      $$('.card').forEach(c=>c.classList.remove('win','lose'));
      if(rolled.length===0){
        pHi.textContent='최고: -';
        pLo.textContent='최저: -';
        pTies.textContent='';
        pTies.classList.add('hidden');
        copyBtn.disabled = true;
        return;
      }
      const max = Math.max(...rolled.map(x=>x.value));
      const min = Math.min(...rolled.map(x=>x.value));
      const highs = state.players.filter(x=>x.value===max);
      const lows  = state.players.filter(x=>x.value===min);
      pHi.textContent = `최고: ${max} (${highs.map(nameOf).join(', ')})`;
      pLo.textContent = `최저: ${min} (${lows.map(nameOf).join(', ')})`;
      highs.forEach(x=>{ const c = $(`.card[data-id="${x.id}"]`); c?.classList.add('win'); });
      lows.forEach(x=>{ const c = $(`.card[data-id="${x.id}"]`); c?.classList.add('lose'); });
      const tie = highs.length>1 || lows.length>1;
      pTies.textContent = tie ? '동점 있음: 재도전 권장' : '';
      pTies.classList.toggle('hidden', !tie);
      copyBtn.disabled = rolled.length!==total;
      if(rolled.length===total && !state.announced){
        const hiMsg = `👍: ${highs.map(nameOf).join(', ')} (${max})`;
        const loMsg = `👎: ${lows.map(nameOf).join(', ')} (${min})`;
        showToast([hiMsg, loMsg]);
        state.announced = true;
        try{ document.activeElement?.blur?.(); }catch(_){}
      }
    }

    // ---------- Auto layout selection (no user control) ----------
    function clearViewClasses(){ cards.classList.remove('compact','list2','list3'); }
    function overflow(){ return document.documentElement.scrollHeight > window.innerHeight + 2; }

    function autoLayoutToFit(){
      clearViewClasses();
      if(!overflow()) return;
      cards.classList.add('compact');
      if(!overflow()) return;
      cards.classList.remove('compact'); cards.classList.add('list3');
      if(!overflow()) return;
      cards.classList.remove('list3'); cards.classList.add('list2');
    }

    // ---------- UI wiring ----------
    const modeRadios = $$('input[name="mode"]');
    modeRadios.forEach(r=>r.addEventListener('change',()=>{
      const m = $('input[name="mode"]:checked').value;
      $('#group-count').classList.toggle('hidden', m!=='count');
      $('#group-names').classList.toggle('hidden', m!=='names');
    }));

    const countInput = $('#count');
    if(countInput){
      countInput.addEventListener('input', (e)=>{
        const v = parseInt(e.target.value,10);
        if(Number.isFinite(v) && v>100){
          alert('최대 100명까지 입력 가능합니다');
          e.target.value = 100;
        }
      });
    }

    $('#generate').addEventListener('click',()=>{
      const mode = $('input[name="mode"]:checked').value;
      if(mode==='count'){
        const n = parseInt($('#count').value,10);
        if(!Number.isFinite(n)||n<2){ alert('인원수 2명 이상'); return; }
        if(n>100){ alert('최대 100명까지'); return; }
        start(n);
      } else {
        const raw = $('#names').value || '';
        startByNames(raw);
      }
    });

    // Keyboard shortcuts (disabled while typing in inputs)
    document.addEventListener('keydown',(e)=>{
      const ae = document.activeElement;
      const isTyping = ae && (
        (ae.tagName === 'INPUT' && (ae.type === 'text' || ae.type === 'number')) ||
        ae.tagName === 'TEXTAREA' ||
        ae.isContentEditable
      );
      if(isTyping) return;
      const inCardsContext = cards.contains(ae) || ae === document.body || ae === document.documentElement || ae == null;
      if(!inCardsContext) return;
      if(e.key==='Enter'){
        e.preventDefault();
        $('#generate').click();
        return;
      }
      if(e.code==='Space'){
        const next = getNextTarget(); // fixed undefined var
        if(next){
          e.preventDefault();
          const card = next.closest('.card');
          focusCard(card);
          next.click();
        }
      }
    });

    // Copy result handler
    copyBtn.addEventListener('click', async()=>{
      const ok = await copyText(buildSummaryText());
      showToast(ok ? '결과 복사됨' : '복사 실패: 브라우저 권한을 확인해주세요');
    });

    // URL params (no double-decode)
    const url = new URL(location.href);
    const pn = parseInt(url.searchParams.get('n')||'');
    const auto = url.searchParams.get('auto');
    const pnames = url.searchParams.get('names');
    if(pnames){
      $('input[name="mode"][value="names"]').checked = true;
      $('#group-count').classList.add('hidden');
      $('#group-names').classList.remove('hidden');
      $('#names').value = pnames;
      if(auto){ startByNames($('#names').value); }
    } else if(Number.isFinite(pn)){
      $('#count').value = pn; if(auto){ start(pn); }
    }

    // Debounced resize
    let _rzTmr = null;
    window.addEventListener('resize', ()=>{
      clearTimeout(_rzTmr);
      _rzTmr = setTimeout(autoLayoutToFit, 120);
    });
  </script>
</body>
</html>
